<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Nomvu</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      color: #1f2937;
    }

    .contacto-container {
      max-width: 720px;
      margin: 48px auto;
      padding: 32px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .contacto-header {
      margin-bottom: 24px;
    }

    .contacto-header h1 {
      margin: 0 0 8px 0;
      font-size: 1.75rem;
    }

    .contacto-header p {
      margin: 0;
      color: #6b7280;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      background-color: #ffffff;
      color: #111827;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #2c4a9e;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .btn-enviar {
      margin-top: 24px;
      width: 100%;
      padding: 13px 20px;
      background-color: #2c4a9e;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-enviar:hover {
      background-color: #213878;
    }

    .btn-enviar:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .contacto-container {
        margin: 24px 16px;
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <main class="contacto-container">
    <div class="contacto-header">
      <h1>Envíanos un mensaje</h1>
      <p>Completa el formulario y nos pondremos en contacto contigo.</p>
    </div>

    <form id="form-contacto">
      <div class="form-grid">
        <div class="form-group">
          <label for="nombre_completo">Nombre completo</label>
          <input
            type="text"
            id="nombre_completo"
            name="nombre_completo"
            placeholder="Tu nombre"
            required
          >
        </div>

        <div class="form-group">
          <label for="correo_electronico">Correo electrónico</label>
          <input
            type="email"
            id="correo_electronico"
            name="correo_electronico"
            placeholder="nombre@correo.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="tipo_consulta">Tipo de consulta</label>
          <select id="tipo_consulta" name="tipo_consulta">
            <option value="Asistente / Visitante">Asistente / Visitante</option>
            <option value="Productor / Organizador">Productor / Organizador</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="estado">Estado</label>
          <select id="estado" name="estado">
            <option value="Distrito Capital">Distrito Capital</option>
            <option value="Amazonas">Amazonas</option>
            <option value="Anzoátegui">Anzoátegui</option>
            <option value="Apure">Apure</option>
            <option value="Aragua">Aragua</option>
            <option value="Barinas">Barinas</option>
            <option value="Bolívar">Bolívar</option>
            <option value="Carabobo">Carabobo</option>
            <option value="Cojedes">Cojedes</option>
            <option value="Delta Amacuro">Delta Amacuro</option>
            <option value="Falcón">Falcón</option>
            <option value="Guárico">Guárico</option>
            <option value="Lara">Lara</option>
            <option value="Mérida">Mérida</option>
            <option value="Miranda">Miranda</option>
            <option value="Monagas">Monagas</option>
            <option value="Nueva Esparta">Nueva Esparta</option>
            <option value="Portuguesa">Portuguesa</option>
            <option value="Sucre">Sucre</option>
            <option value="Táchira">Táchira</option>
            <option value="Trujillo">Trujillo</option>
            <option value="La Guaira">La Guaira</option>
            <option value="Yaracuy">Yaracuy</option>
            <option value="Zulia">Zulia</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="mensaje">Mensaje</label>
          <textarea
            id="mensaje"
            name="mensaje"
            placeholder="Cuéntanos en que podemos ayudarte..."
            required
          ></textarea>
        </div>
      </div>

      <button type="submit" id="btn-enviar" class="btn-enviar">Enviar consulta</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'PEGA_AQUI_TU_URL_DE_SUPABASE';
    const SUPABASE_KEY = 'PEGA_AQUI_TU_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const formContacto = document.getElementById('form-contacto');
    const btnEnviar = document.getElementById('btn-enviar');

    formContacto.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnEnviar.disabled = true;
      btnEnviar.textContent = 'Enviando...';

      const formData = new FormData(formContacto);

      const datos = {
        nombre_completo: formData.get('nombre_completo').trim(),
        correo_electronico: formData.get('correo_electronico').trim(),
        tipo_consulta: formData.get('tipo_consulta'),
        estado: formData.get('estado'),
        mensaje: formData.get('mensaje').trim()
      };

      const { error } = await supabaseClient
        .from('personas')
        .insert([datos]);

      if (error) {
        console.error('Error al guardar en Supabase:', error);
        alert('Error al guardar: ' + error.message);
      } else {
        alert('¡Consulta enviada con éxito!');
        formContacto.reset();
      }

      btnEnviar.disabled = false;
      btnEnviar.textContent = 'Enviar consulta';
    });
  </script>
</body>
</html>
